apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    {{- include "youtube-manager.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: run-migrations
          image: {{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["python", "-m", "alembic", "upgrade", "head"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: postgres-password
            - name: DATABASE_URL
              value: {{ include "youtube-manager.databaseUrl" . | quote }}
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: secret-key
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: YOUTUBE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: youtube-client-id
            - name: YOUTUBE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: youtube-client-secret
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: openai-api-key

      containers:
        - name: backend
          image: {{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: postgres-password
            - name: DATABASE_URL
              value: {{ include "youtube-manager.databaseUrl" . | quote }}
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: secret-key
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: openai-api-key
            - name: YOUTUBE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: youtube-client-id
            - name: YOUTUBE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: youtube-client-secret
            - name: QSTASH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: qstash-token
            - name: QSTASH_CURRENT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: qstash-current-signing-key
            - name: QSTASH_NEXT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: qstash-next-signing-key
          envFrom:
            - configMapRef:
                name: app-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
              httpHeaders:
                - name: Host
                  value: {{ .Values.domain }}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
              httpHeaders:
                - name: Host
                  value: {{ .Values.domain }}
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ .Values.backend.resources.requests.cpu | quote }}
              memory: {{ .Values.backend.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.backend.resources.limits.cpu | quote }}
              memory: {{ .Values.backend.resources.limits.memory | quote }}
