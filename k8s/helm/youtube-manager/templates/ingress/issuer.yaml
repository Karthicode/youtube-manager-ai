{{- if .Values.ingress.tls.enabled }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ .Values.ingress.tls.issuerName }}
  labels:
    {{- include "youtube-manager.labels" . | nindent 4 }}
spec:
  acme:
    # The ACME server URL
    server: https://acme-v02.api.letsencrypt.org/directory
    # Email address used for ACME registration
    email: {{ .Values.ingress.tls.email | default "karthikga124@gmail.com" }}
    # Name of a secret used to store the ACME account private key
    privateKeySecretRef:
      name: {{ .Values.ingress.tls.issuerName }}-account-key
    # Enable the HTTP-01 challenge provider using Gateway API
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: youtube-manager-gateway
                kind: Gateway
                namespace: {{ .Release.Namespace }}
{{- end }}
