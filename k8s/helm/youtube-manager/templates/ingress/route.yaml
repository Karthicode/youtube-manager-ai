apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: youtube-manager-route
  labels:
    {{- include "youtube-manager.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: youtube-manager-gateway
  hostnames:
    - {{ .Values.domain | quote }}
  rules:
    # --- Backend Rules (/api and /mcp) ---
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: backend-svc
          port: 8000

    # --- Frontend Rule (Catch-all /) ---
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend-svc
          port: 3000