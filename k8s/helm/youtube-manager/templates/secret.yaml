apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  labels:
    {{- include "youtube-manager.labels" . | nindent 4 }}
type: Opaque
# Helm base64-encodes values automatically when you use stringData.
# stringData is the human-readable form; K8s stores it as base64 in data.
stringData:
  postgres-password: {{ .Values.secrets.postgresPassword | quote }}
  secret-key: {{ .Values.secrets.secretKey | quote }}
  openai-api-key: {{ .Values.secrets.openaiApiKey | quote }}
  youtube-client-id: {{ .Values.secrets.youtubeClientId | quote }}
  youtube-client-secret: {{ .Values.secrets.youtubeClientSecret | quote }}
  qstash-token: {{ .Values.secrets.qstashToken | quote }}
  qstash-current-signing-key: {{ .Values.secrets.qstashCurrentSigningKey | quote }}
  qstash-next-signing-key: {{ .Values.secrets.qstashNextSigningKey | quote }}
