name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Detect changes
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  backend-checks:
    name: Backend Checks
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: backend/.venv
          key: venv-${{ runner.os }}-${{ hashFiles('backend/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Check formatting with Black
        run: poetry run black --check .

      - name: Lint with Ruff
        run: poetry run ruff check .

      - name: Type check with MyPy
        run: poetry run mypy app --ignore-missing-imports

  frontend-checks:
    name: Frontend Checks
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting with Biome
        run: bunx biome format --error-on-warnings .

      - name: Lint with Biome
        run: bunx biome lint --error-on-warnings .

      - name: Type check with TypeScript
        run: bunx tsc --noEmit

      - name: Build application
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
        run: bun run build

  security-checks:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install security tooling
        run: pip install semgrep pip-audit

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config .semgrep.yml \
            --config "p/owasp-top-ten" \
            --config "p/secrets" \
            --error \
            --quiet

      - name: Backend dependency audit
        working-directory: backend
        env:
          # Without this, pip-audit's pip-based dependency source scans the
          # runner's system Python instead of poetry's venv, and reports the
          # runner image's own stale click/setuptools instead of our deps.
          PIPAPI_PYTHON_LOCATION: ${{ github.workspace }}/backend/.venv/bin/python
        run: |
          poetry install --no-interaction --no-root
          poetry run pip-audit --strict

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend dependency audit
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high

  pr-status:
    name: PR Status
    runs-on: ubuntu-latest
    needs: [detect-changes, backend-checks, frontend-checks, security-checks]
    if: always()
    steps:
      - name: Check status
        run: |
          if [ "${{ needs.backend-checks.result }}" == "failure" ] || \
             [ "${{ needs.frontend-checks.result }}" == "failure" ] || \
             [ "${{ needs.security-checks.result }}" == "failure" ]; then
            echo "One or more checks failed"
            exit 1
          fi
          echo "All checks passed or were skipped"
